<!DOCTYPE html>
<html>

<head>
    <title>List.html</title>
</head>

<body>
    <h1>Ordered List</h1>
    <ol type="i">
        <li>Car</li>
        <li>Bike</li>
        <li>Bus</li>
    </ol>

    <H1>Unordered List</H1>
    <ul type="Square">
        <li>Apple</li>
        <li>Grape</li>
        <li>Mango</li>
    </ul>

    <h1>Nested List</h1>

    <ul>
        <li>Car</li>
        <ol>
            <li>Audi</li>
            <li>Benz</li>
            <li>BMW</li>
        </ol>
    </ul>

    <ol>
        <li>Bike</li>
        <ul>
            <li>Pulser</li>
            <li>KTM</li>
            <li>MT</li>
        </ul>
    </ol>

    <H1>Description List</H1>
    <Dl>
        <dt>Vehicles</dt>
        <dd>Bike, Car, Bus</dd>
        <dt>Fruits</dt>
        <dd>Apple, Mango</dd>
    </Dl>

</body>

</html>
