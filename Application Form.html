<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Form</title>
</head>
<body>
    <h1>Job Application Form</h1>

    <fieldset>
        <legend>
Personal Info
        </legend><br>
        <label for="">Full Name:</label><br>
        <input type="text" name="" id="" placeholder="Enter Name"><br><br>

        <label for="">Email:</label><br>
        <input type="email" name="" id="" placeholder="Enter Email"><br><br>

        <label for="">Phone:</label><br>
        <input type="tel" name="" id="" maxlength="10" placeholder="Enther Phone"><br>
    </fieldset>

    <fieldset>
        <legend>
            Application Details
        </legend><br>

        <label for="">Position Applied For:</label><br>
       <select name="" id="">
            <option value="Developer">Developer</option>
            <option value="Designer">Designer</option>
</select>    
</fieldset>
</body>
</html>
