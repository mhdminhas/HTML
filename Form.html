<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>

<body>
    <h1>Form</h1>
    <form action="">
        <label for="">User Name:</label>
        <input type="text" placeholder="Enter Name"><br><br>


        <label for="">Password:</label>
        <input type="password" placeholder="Enter Password"><br><br>


        <label for="">Email:</label>
        <input type="email" placeholder="Enter Email"><br><br>


        <label for="">Age:</label>
        <input type="number" placeholder="Enter Age"><br><br>


        <label for="">DOB:</label>
        <input type="date" name="" id=""><br><br>


        <label for="">Time:</label>
        <input type="time" name="" id=""><br><br>


        <label for="">Uplode Resume:</label>
        <input type="file" name="" id=""><br><br>


        <label for="">Skills:</label><br>
        <input type="checkbox" name="" id="">Programming <br>
        <input type="checkbox" name="" id="">Design <br>
        <input type="checkbox" name="" id="">Manegment <br><br>


        <label for="">Gender:</label>
        <input type="radio" name="A" id="">Male
        <input type="radio" name="A" id="">Female <br><br>


        <label for="">Country:</label>
        <select name="" id="">
            <option value="">India</option>
            <option value="">Uk</option>
            <option value="">Usa</option>
            <option value="">Ksa</option>
            <option value="">Uae</option>
        </select><br><br>


        <label for="">Volume:</label>
        <input type="range" name="" id=""><br><br>


        <label for="">Colour:</label>
        <input type="color" name="" id=""><br><br>


        <label for="">Website:</label>
        <input type="url" name="" id="" placeholder="Ente Website URL"><br><br>


        <label for="">Phone Number:</label>
        <input type="tel" name="" id="" maxlength="10" placeholder="Enter Phone Number"><br><br>


        <label for="">Message:</label>
        <textarea cols="10" rows="5" placeholder="Enter Message"></textarea><br><br>


        <label for="">User Id:</label>
        <input type="hidden" name="" id=""><br><br>


        <fieldset>
            <legend>
                Select Plan
            </legend>
            <input type="radio" name="Plan" id="">Basic <br>
            <input type="radio" name="Plan" id="">Premium
        </fieldset> <br><br>


        <input type="submit" name="" id="">
        <button>Save</button>
        <input type="reset" name="" id="">
        <button onclick="alert(button clicked)">click</button><br><br>

    </form>
</body>

</html>
